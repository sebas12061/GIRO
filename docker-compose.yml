services:
  postgres:
    image: postgres:16
    container_name: giro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: giro_db
      POSTGRES_USER: giro_user
      POSTGRES_PASSWORD: giro_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
