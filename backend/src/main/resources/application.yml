spring:
  application:
    name: giro-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/giro_db}
    username: ${SPRING_DATASOURCE_USERNAME:giro_user}
    password: ${SPRING_DATASOURCE_PASSWORD:giro_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

giro:
  bootstrap:
    enabled: ${GIRO_BOOTSTRAP_ENABLED:false}
    restaurant-identification: ${GIRO_RESTAURANT_IDENTIFICATION:GIRO-LOCAL}
    restaurant-name: ${GIRO_RESTAURANT_NAME:Restaurante GIRO}
    admin-username: ${GIRO_ADMIN_USERNAME:admin}
    admin-password: ${GIRO_ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${GIRO_JWT_SECRET:giro-development-secret-key-change-in-production-2026}
      expiration-ms: ${GIRO_JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
